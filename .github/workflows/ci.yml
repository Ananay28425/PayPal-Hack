name: Python regression suite
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run isolated mock tests
        env:
          ASSEMBLY_DEMO_TOKEN: test-only-demo-token
          ASSEMBLY_PAYMENT_MODE: mock
          ASSEMBLY_DATABASE_URL: sqlite://
        run: python -m pytest tests -q
